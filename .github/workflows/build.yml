#
# Based on GXDE-OS/GXDE .github/workflows/building-pkg.yml, with an
# x86_64/aarch64 matrix and a single pre-build update job.

name: Building GXDE Arch Package

on:
  schedule:
    - cron: '0 3 */10 * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  BOTTLEPATH: system-bottle
  GXDE_REPOSITORY: https://github.com/GXDE-OS/GXDE
  GXDE_ARCH_REPO: https://repo1.gxde.top/gxde-arch

jobs:
  update:
    if: github.repository_owner == 'GXDE-OS'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install update tools
        run: |
          sudo apt update
          sudo apt install -y jq curl

      - name: Update to latest ONNX Runtime release
        run: ./update.sh

      - name: Commit version bump
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- PKGBUILD; then
            git add PKGBUILD
            git commit -m 'chore: update onnxruntime [skip ci]'
            git push
          fi

  build:
    needs: update
    if: github.repository_owner == 'GXDE-OS'
    name: ${{ matrix.arch }}-arch
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Clone GXDE build scripts
        run: git clone "$GXDE_REPOSITORY" --depth=1 /tmp/gxde

      - name: Configure Base System
        run: |
          bash /tmp/gxde/.github/workflows/configure-building-enviroment-arch.sh ${{ matrix.arch }} \
            "$GXDE_REPOSITORY" \
            "https://github.com/$GITHUB_REPOSITORY" \
            "${{ github.ref_name }}" \
            "$GXDE_ARCH_REPO"

      - name: Building
        run: |
          gitPath=/home/builder/$(basename "$GITHUB_REPOSITORY")
          sudo chroot "$BOTTLEPATH" sudo -H -u builder bash -c \
            "cd $gitPath && makepkg -s --noconfirm --needed"
          mkdir -p packages
          sudo find "$BOTTLEPATH$gitPath" -maxdepth 1 -name '*.pkg.tar.*' ! -name '*.sig' -exec cp -v {} packages/ \;
          sudo chown -R "$(id -u):$(id -g)" packages
          ls -l packages

      - name: Remove Debug Package
        run: rm -fv packages/*-debug-*.pkg.tar.*

      - name: Pack tar
        run: |
          cd packages
          tar -cvf "../arch-${{ matrix.arch }}-$(date +%s).tar" *.pkg.tar.*

      - name: Push
        env:
          UPASSWD: ${{ secrets.PASSWD }}
          UUSERS: ${{ secrets.USERS }}
          UHOST: ${{ secrets.HOST }}
          UPATH: ${{ secrets.UPATH }}
          UPROGRAM_ARCH: ${{ secrets.UPROGRAM_ARCH }}
          UPORT: ${{ secrets.UPORT }}
        run: |
          if [[ -z "$UPROGRAM_ARCH" ]]; then
            echo "::warning::UPROGRAM_ARCH is not set, skip uploading Arch packages"
            exit 0
          fi
          sudo apt install -y sshpass
          mkdir -p ~/.ssh/
          ssh-keyscan -p "$UPORT" -H "$UHOST" >> ~/.ssh/known_hosts
          tarName=$(ls | grep '^arch-.*\.tar$' | head -n 1)
          sshpass -p "$UPASSWD" rsync -e "ssh -p $UPORT" "$tarName" "$UUSERS@$UHOST:$UPATH"
          sshpass -p "$UPASSWD" ssh "$UUSERS@$UHOST" -p "$UPORT" "$UPROGRAM_ARCH" ${{ matrix.arch }} "$UPATH/$tarName" > /dev/null

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOCKEN_GITHUB }}
        with:
          files: |
            packages/*.pkg.tar.*
